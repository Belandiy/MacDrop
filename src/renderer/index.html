<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MacDrop</title>
    <style>
      /* Zero-blocking instant styles before CSS bundle loads */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #090a0f;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      @keyframes skeleton-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .sk-pulse {
        animation: skeleton-pulse 1.8s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-[#090a0f] text-slate-100 selection:bg-indigo-600 selection:text-white select-none overflow-hidden font-sans antialiased">
    <div id="root">
      <!-- Instant Skeleton UI rendered in 0ms while React bundle compiles -->
      <div style="display:flex; flex-direction:column; height:100vh; background-color:#090a0f; box-sizing:border-box;">
        <!-- Header Skeleton -->
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.06); background:rgba(17,19,25,0.7);">
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg, #6366f1, #3b82f6);" class="sk-pulse"></div>
            <span style="font-size:14px; font-weight:700; letter-spacing:-0.02em; color:#f8fafc;">MacDrop</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,0.08);" class="sk-pulse"></div>
            <div style="width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,0.08);" class="sk-pulse"></div>
          </div>
        </div>

        <!-- Body Skeleton -->
        <div style="flex:1; padding:16px; display:flex; flex-direction:column; gap:14px; box-sizing:border-box;">
          <!-- Device List Card Skeleton -->
          <div style="background:#111319; border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:12px;" class="sk-pulse">
            <div style="height:12px; width:45%; background:rgba(255,255,255,0.08); border-radius:4px; margin-bottom:10px;"></div>
            <div style="height:48px; background:rgba(255,255,255,0.04); border-radius:8px;"></div>
          </div>

          <!-- DropZone Skeleton -->
          <div style="flex:1; min-height:160px; background:radial-gradient(circle at 50% 50%, rgba(99,102,241,0.05) 0%, rgba(17,19,25,0.6) 100%); border:1px dashed rgba(255,255,255,0.12); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;" class="sk-pulse">
            <div style="width:40px; height:40px; border-radius:12px; background:rgba(99,102,241,0.15);"></div>
            <div style="height:12px; width:55%; background:rgba(255,255,255,0.08); border-radius:4px;"></div>
            <div style="height:10px; width:35%; background:rgba(255,255,255,0.05); border-radius:4px;"></div>
          </div>

          <!-- Target Folder Card Skeleton -->
          <div style="background:#111319; border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:12px; display:flex; align-items:center; justify-content:space-between;" class="sk-pulse">
            <div style="height:12px; width:50%; background:rgba(255,255,255,0.08); border-radius:4px;"></div>
            <div style="width:24px; height:24px; border-radius:6px; background:rgba(255,255,255,0.06);"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
