name: Build Tauri Windows & macOS

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tauri-migration
      - main
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis --no-sign'
          - platform: 'macos-latest'
            args: '--bundles app --no-sign'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'MacDrop v__VERSION__'
          args: ${{ matrix.args }}

      - name: Prepare Windows Portable Executables
        if: matrix.platform == 'windows-latest'
        run: node scripts/copy-tauri-portable.js

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macdrop-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release/*portable*.exe
            src-tauri/target/release/macdrop.exe
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macdrop-tauri-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
